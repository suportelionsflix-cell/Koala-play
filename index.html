<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="sintonia-proxy" content="">
<title>KOALA PLAYER</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Sempre horizontal e sempre escuro. Layout: palco escuro de TV. Topo com marca e relógio, trilho de atalhos grandes, rodapé com ferramentas. Telas internas em colunas (categorias, lista, prévia). */
:root{
  --bg:#000000;--panel:rgba(255,255,255,.07);--panel2:rgba(255,255,255,.12);--line:rgba(255,255,255,.17);--glass-hi:rgba(255,255,255,.3);
  --fg:#ffffff;--mute:#b9bcc3;--accent:#e8101a;--accent-fg:#ffffff;
  --ok:#ffffff;--bad:#ff4d57;--shade:rgba(0,0,0,.6);
  --display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
  --z:1;--H:calc(100dvh/var(--z));--u:calc(1vh/var(--z));
}
@media (orientation:portrait){html[data-mode=mobile]{--H:100dvw;--u:1vw}}
*{box-sizing:border-box}
html,body{margin:0}
#stage{zoom:var(--z)}
body{background:radial-gradient(60vmax 42vmax at 12% 8%,rgba(232,16,28,.30),transparent 62%),radial-gradient(52vmax 40vmax at 92% 90%,rgba(232,16,28,.14),transparent 62%),radial-gradient(40vmax 30vmax at 70% 20%,rgba(255,255,255,.06),transparent 65%),var(--bg);background-attachment:fixed;color:var(--fg);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
img{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.mute{color:var(--mute)}
.ic{flex:none}

.wrap{min-height:var(--H);max-width:1400px;margin:auto;display:flex;flex-direction:column;gap:20px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:980px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.lgrid:not(.one){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lgrid.one{max-width:560px;width:100%;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font:700 24px var(--display);letter-spacing:.06em}
.logo-img{height:clamp(34px,calc(var(--u)*9),56px);width:auto;max-width:60vw;display:block;filter:drop-shadow(0 4px 14px rgba(0,0,0,.6))}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.clock{text-align:right}
.clock b{display:block;font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.clock span{color:var(--mute);font-size:13px;text-transform:capitalize}

.wrap.home{min-height:var(--H)}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.rb:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:12px;padding:4px}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input[type=text],input[type=password],input[type=search],input:not([type]),input[type=url],input[type=file]{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--fg);min-width:0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:stretch}
.prow .pmain{flex:1;min-width:0;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.prow .pmain small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head h1{font-size:22px;margin-right:auto}
.head input{max-width:320px}
.wrap.full{height:var(--H);min-height:0}

.live{flex:1;min-height:0;display:grid;grid-template-columns:minmax(120px,18%) minmax(0,1fr) minmax(250px,44%);gap:16px}
.cats,.rows{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.cat{text-align:left;padding:11px 14px;border-radius:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.cat.on{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;flex:none;border-radius:12px}
.row.on{background:var(--panel2)}
.rmain{display:grid;grid-template-columns:34px 44px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;text-align:left;border-radius:12px}
.rmain .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
.rmain .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:44px;height:32px;object-fit:contain;border-radius:6px;background:var(--panel2)}
.logo.none{display:block}
.star{width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.star.on{color:var(--accent)}.star.on svg{fill:var(--accent)}
.more{padding:14px;color:var(--accent);font-weight:600;flex:none}
.empty{color:var(--mute);padding:24px 8px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.pv{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.pv video{width:100%;height:100%;background:#000;display:block}
.pv-empty{position:absolute;inset:0;display:grid;place-items:center;color:#b9bcc3;pointer-events:none}
.now{font:600 17px var(--display)}
.epg{display:flex;flex-direction:column;gap:6px;color:var(--mute)}
.epg .cur{color:var(--fg);font-weight:600}
.epg b{color:var(--fg);font-variant-numeric:tabular-nums;margin-right:10px;font-weight:500}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(130px,20%) minmax(0,1fr);gap:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;flex:none}
.chips .cat{border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.chips .cat.on{box-shadow:none;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;align-content:start}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.poster{aspect-ratio:2/3;border-radius:14px;background:var(--panel2);object-fit:cover;width:100%;border:1px solid var(--line)}
.card span{font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card:hover .poster,.card:focus-visible .poster{border-color:var(--accent)}
.scroll{flex:1;min-height:0;overflow:auto}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .cat{border:1px solid var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-content:start}
.scard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-align:center}
.scard svg{width:38px;height:38px;color:var(--accent)}
.scard:hover,.scard:focus-visible{border-color:var(--accent)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(720px,100%);max-height:calc(var(--H)*.92);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px var(--shade)}
.modal h2{font-size:22px;padding-right:40px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel2)}
.det{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.eps{display:flex;flex-direction:column;gap:6px;max-height:calc(var(--H)*.42);overflow:auto}
.ep{font-size:14px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel2);display:flex;gap:12px;align-items:center}
.ep small{color:var(--mute);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px}
.kv dt{color:var(--mute)}.kv dd{margin:0;overflow-wrap:anywhere}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:15px;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.hide-list{max-height:calc(var(--H)*.46);overflow:auto}
.player{z-index:60;background:#000;padding:0;place-items:stretch}
.pbox{display:flex;flex-direction:column;height:100%}
.pbar{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px));padding-top:max(12px,env(safe-area-inset-top,0px));color:#fff}
.pbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display)}
.pbox video{flex:1;min-height:0;width:100%;background:#000}
.busy{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;text-align:center;gap:16px;align-content:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:auto}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:min(520px,92vw);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;display:none}
#toast.bad{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html[data-mode=tv] :focus-visible{outline-width:5px;outline-offset:3px}
html[data-mode=tv] .row:focus-within,html[data-mode=tv] .cat:focus-visible,html[data-mode=tv] .ep:focus-visible{background:var(--panel2)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border-radius:22px;border:2px solid var(--line);background:var(--panel2);text-align:center}
.mode svg{color:var(--accent)}.mode b{font:700 22px var(--display)}.mode small{color:var(--mute)}
.mode:hover,.mode:focus-visible,.mode.on{border-color:var(--accent)}
/* Vidro líquido: superfícies translúcidas com desfoque e brilho na borda superior */
.rb,.panel,.modal,.scard,.mode,.pill,.dcard,.infobox{-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5)}
.scard,.mode,.panel,.rb,.pill,.dcard,.infobox{background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 55%);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.05),0 10px 26px rgba(0,0,0,.45)}
.modal{background:rgba(20,20,20,.7);background-image:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 50%);box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 70px rgba(0,0,0,.7)}
.mark{background-image:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(232,16,28,.35)}
.btn{background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary{background-image:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,0) 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(232,16,28,.3)}
.row.on,.cat.on{box-shadow:inset 0 1px 0 var(--glass-hi)}
.seg,.rmain:focus-visible{background-image:none}
input[type=text],input[type=password],input[type=search],input:not([type]),input[type=url],input[type=file]{background:rgba(0,0,0,.4)}
@supports not (backdrop-filter:blur(1px)){.rb,.panel,.scard,.mode,.pill,.dcard,.infobox{background-color:#161616}.modal{background-color:#141414}}
/* Início: quatro atalhos redondos, cartão de data e hora, atalhos em pílula */
.wrap.home{gap:0;justify-content:space-between}
.top.home-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;flex-wrap:nowrap}
.top.home-top .brand{justify-self:start}
.dcard{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px clamp(18px,calc(var(--u)*6),44px);border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.dcard span{color:var(--mute);font-size:clamp(11px,calc(var(--u)*2.6),14px);order:-1}
.dcard span::first-letter{text-transform:uppercase}
.dcard b{font:700 clamp(20px,calc(var(--u)*5.6),34px)/1.1 var(--display);font-variant-numeric:tabular-nums}
.topicons{justify-self:end;display:flex;gap:10px}
.hi-row{flex:1;display:flex;align-items:center;justify-content:space-evenly;gap:clamp(8px,2vw,32px);min-height:0;padding-block:12px}
.hi{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,calc(var(--u)*2.4),18px);font:600 clamp(13px,calc(var(--u)*3.8),22px) var(--display);color:var(--fg);min-width:0;border-radius:24px;padding:6px}
.disc{width:clamp(66px,calc(var(--u)*24),190px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 14%,rgba(255,255,255,.3),rgba(255,255,255,.06) 62%);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 2px 0 var(--glass-hi),0 14px 30px rgba(0,0,0,.55);transition:transform .15s,background .15s,border-color .15s}
.disc svg{width:46%;height:46%;color:#fff}
.hi:hover .disc,.hi:focus-visible .disc{transform:translateY(-5px);border-color:var(--accent);background:radial-gradient(circle at 50% 14%,rgba(255,255,255,.4),var(--accent) 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 14px 36px rgba(232,16,28,.5)}
.hi:hover,.hi:focus-visible{color:var(--accent)}
.hi:focus-visible{outline:none}
.hi:focus-visible .disc{outline:3px solid #fff;outline-offset:4px}
.hbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.infobox{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:clamp(11px,calc(var(--u)*2.6),14px);color:var(--mute)}
.infobox b{color:var(--fg);font-weight:600}
.pills{display:flex;gap:clamp(6px,1.4vw,14px);flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:clamp(12px,calc(var(--u)*3.1),16px)}
.pill i{width:clamp(28px,calc(var(--u)*7),40px);aspect-ratio:1;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-style:normal}
.pill i svg{width:56%;height:56%;color:#fff}
.pill:hover,.pill:focus-visible{border-color:var(--accent)}
.dot{display:inline-block}
/* Horizontal (padrão): telas baixas ficam mais compactas */
/* Celular em pé: o app inteiro gira 90 graus e continua horizontal */
@media (orientation:portrait){
  html[data-mode=mobile],html[data-mode=mobile] body{height:100%;overflow:hidden}
  html[data-mode=mobile] #stage{will-change:transform;position:fixed;top:0;left:0;width:100dvh;height:100dvw;overflow:hidden;transform-origin:0 0;transform:translateX(100dvw) rotate(90deg)}
  html[data-mode=mobile] #view{height:100%;overflow:hidden}
}

/* Tela de entrada: tamanhos proporcionais à altura da tela */
html .lg{gap:clamp(8px,calc(var(--u)*2),20px)}
html .wrap.narrow.lg{max-width:1100px}
html .lg .lgrid{gap:clamp(10px,calc(var(--u)*2.4),20px)}
html .lg .lgrid.one{max-width:760px}
html .lg .panel{padding:clamp(10px,calc(var(--u)*2.6),24px);gap:clamp(6px,calc(var(--u)*1.8),14px);border-radius:clamp(12px,calc(var(--u)*3),22px)}
html .lg h1{font-size:clamp(16px,calc(var(--u)*4),26px)}
html .lg h2{font-size:clamp(14px,calc(var(--u)*3.4),22px)}
html .lg form{gap:clamp(6px,calc(var(--u)*1.6),12px)}
html .lg .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,calc(var(--u)*1.6),12px)}
html .lg .fgrid .wide{grid-column:1/-1}
html .lg label{font-size:clamp(10px,calc(var(--u)*2.4),13px);gap:3px}
html .lg input[type=text],html .lg input[type=password],html .lg input[type=url],html .lg input[type=file]{padding:clamp(6px,calc(var(--u)*1.7),12px) 12px;font-size:clamp(12px,calc(var(--u)*3),16px);border-radius:10px}
html .lg .btn{padding:clamp(7px,calc(var(--u)*1.8),12px) 16px;font-size:clamp(12px,calc(var(--u)*3),16px);border-radius:10px}
html .lg .seg button{padding:clamp(6px,calc(var(--u)*1.6),10px);font-size:clamp(12px,calc(var(--u)*3),16px)}
html .lg .prow .pmain{padding:clamp(7px,calc(var(--u)*1.8),12px) 12px;font-size:clamp(12px,calc(var(--u)*3),16px)}
html .lg .prow .pmain small,html .lg small{font-size:clamp(10px,calc(var(--u)*2.4),13px)}
html .lg .rb{width:clamp(32px,calc(var(--u)*8),44px);height:clamp(32px,calc(var(--u)*8),44px)}
html .lg .plist{gap:clamp(5px,calc(var(--u)*1.4),8px);max-height:calc(var(--H)*.55);overflow:auto}

/* ===== Tela estática e proporcional: nada rola, tudo cabe e acompanha a altura do aparelho ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden}
#view{height:100%;overflow:hidden}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
:focus{outline:none}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
html[data-mode=tv] :focus{outline:4px solid #fff;outline-offset:3px;border-radius:12px}
html[data-mode=tv] .hi:focus,html[data-mode=tv] input:focus{outline:none}
html[data-mode=tv] .hi:focus .disc{outline:4px solid #fff;outline-offset:4px;border-color:var(--accent);background:radial-gradient(circle at 50% 14%,rgba(255,255,255,.4),var(--accent) 70%)}
html[data-mode=tv] .hi:focus{color:var(--accent)}
html .wrap{height:100%;min-height:0;overflow:hidden;gap:clamp(6px,calc(var(--u)*1.8),18px);padding-block:max(clamp(8px,calc(var(--u)*2),20px),env(safe-area-inset-top,0px)) max(clamp(8px,calc(var(--u)*2),20px),env(safe-area-inset-bottom,0px))}
html .wrap.home{gap:0}
html .brand .logo-img{height:clamp(26px,calc(var(--u)*8),52px)}
html .head{flex:none;gap:clamp(6px,calc(var(--u)*1.6),12px)}
html .head h1{font-size:clamp(14px,calc(var(--u)*4.2),24px)}
html .head input{padding:clamp(5px,calc(var(--u)*1.5),10px) 12px;font-size:clamp(12px,calc(var(--u)*3),16px);max-width:clamp(150px,30vw,300px)}

async function getText(url){

  catch(e){throw new Error('Não foi possível conectar ao servidor. Ele pode bloquear o navegador (CORS) ou usar http numa página https. Ative o proxy em Configurações > Rede.')}
  if(!r.ok)throw new Error('O servidor respondeu com erro '+r.status+'.');

/* ---------- listas ---------- */
const S_RE=/^(.*?)[\s._-]*[Ss](\d{1,2})[\s._-]*[Ee](\d{1,3})/;
function parseM3U(text){
  const out=[];let cur=null;
  for(const raw of text.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    if(l.startsWith('#EXTINF')){
      const a={};
      const rest=l.replace(/([\w-]+)="([^"]*)"/g,(_,k,v)=>{a[k.toLowerCase()]=v;return ''});
      const i=rest.lastIndexOf(',');
      const name=(i>=0?rest.slice(i+1):'').trim()||a['tvg-name']||'Sem nome';
      cur={name,logo:a['tvg-logo']||'',group:a['group-title']||'Sem categoria',epg:a['tvg-id']||''};
    }else if(l[0]!=='#'&&cur){cur.url=l;out.push(cur);cur=null}
  }
  return out;
}
function buildFromEntries(entries){
  const D={live:{cats:[],items:[]},vod:{cats:[],items:[]},series:{cats:[],items:[]},index:new Map()};
  const seen={live:new Set(),vod:new Set(),series:new Set()};
  const sm=new Map();
  const addCat=(k,name)=>{if(!seen[k].has(name)){seen[k].add(name);D[k].cats.push({id:name,name})}};
  let n=0;
  for(const e of entries){
    const sx=S_RE.exec(e.name);
    if(sx||/\/series\//i.test(e.url)){
      const title=sx?sx[1].trim():e.name;
      const id=e.group+'|'+title;
      let s=sm.get(id);
      if(!s){s={key:'series:'+id,type:'series',name:title,logo:e.logo,cat:e.group,eps:[]};sm.set(id,s);addCat('series',e.group);D.series.items.push(s)}
      s.eps.push({season:sx?+sx[2]:1,ep:sx?+sx[3]:s.eps.length+1,title:e.name,url:e.url});
    }else if(/\/movie\//i.test(e.url)||/\.(mp4|mkv|avi)(\?|$)/i.test(e.url)||/filme|movie|vod|cinema/i.test(e.group)){
      addCat('vod',e.group);
      D.vod.items.push({key:'vod:'+(++n),type:'vod',name:e.name,logo:e.logo,cat:e.group,url:e.url});
    }else{
      addCat('live',e.group);
      D.live.items.push({key:'live:'+(++n),type:'live',name:e.name,logo:e.logo,cat:e.group,num:D.live.items.length+1,epg:e.epg,url:e.url});
    }
  }
  return D;
}
const normBase=s=>{s=String(s).trim().replace(/\/+$/,'').replace(/\/(player_api|get)\.php.*$/,'');return /^https?:\/\//i.test(s)?s:'http://'+s};

async function loadXtream(p){
  const base=normBase(p.server),u=encodeURIComponent(p.user),w=encodeURIComponent(p.pass);
  const q=`${base}/player_api.php?username=${u}&password=${w}`;
  const auth=await getJSON(q);
  if(!auth||!auth.user_info||auth.user_info.auth===0)throw new Error('Usuário ou senha não aceitos pelo servidor.');
  const acts=['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'];
  const r=await Promise.all(acts.map(a=>getJSON(`${q}&action=${a}`).catch(()=>[])));
  const arr=x=>Array.isArray(x)?x:[];
  const cats=x=>arr(x).map(c=>({id:String(c.category_id),name:c.category_name||'Sem nome'}));
  const D={live:{cats:cats(r[0]),items:[]},vod:{cats:cats(r[2]),items:[]},series:{cats:cats(r[4]),items:[]},index:new Map()};
  arr(r[1]).forEach((s,i)=>D.live.items.push({key:'live:'+s.stream_id,type:'live',id:s.stream_id,name:s.name,logo:s.stream_icon,cat:String(s.category_id),num:s.num||i+1,epg:s.epg_channel_id,url:`${base}/live/${u}/${w}/${s.stream_id}.m3u8`}));
  arr(r[3]).forEach(s=>D.vod.items.push({key:'vod:'+s.stream_id,type:'vod',id:s.stream_id,name:s.name,logo:s.stream_icon,cat:String(s.category_id),rating:s.rating,year:s.year,url:`${base}/movie/${u}/${w}/${s.stream_id}.${s.container_extension||'mp4'}`}));
  arr(r[5]).forEach(s=>D.series.items.push({key:'series:'+s.series_id,type:'series',id:s.series_id,name:s.name,logo:s.cover,cat:String(s.category_id),plot:s.plot,rating:s.rating,xc:true}));
  D.xc={base,u,w,q};D.info=auth.user_info;D.server=auth.server_info||{};
  return D;
}

/* ---------- player ---------- */
const NATIVE=typeof window.KoalaNative!=='undefined';
const engineOf=k=>{
  if(NATIVE)return (store.nengine&&store.nengine[k])==='vlc'?'vlc':'exo';
  const e=store.engine&&store.engine[k];return e==='native'?'native':'hls';
};
let mts=null;
function detach(){
  if(mts){try{mts.destroy()}catch(e){}mts=null}
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  $$('video').forEach(v=>{try{v.pause();v.removeAttribute('src');v.load()}catch(e){}});
}
function attach(video,url,onFail,kind){
  if(mts){try{mts.destroy()}catch(e){}mts=null}
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  const isHls=/\.m3u8(\?|$)/i.test(url);
  const src=isHls?wrap(url):direct(url);
  const eng=engineOf(kind||'live');
  video._fb=0;
  const fail=()=>{
    if(eng!=='native'&&!video._fb){
      video._fb=1;
      if(mts){try{mts.destroy()}catch(e){}mts=null}
      if(hls){try{hls.destroy()}catch(e){}hls=null}
      video.onerror=()=>{toast('Não foi possível reproduzir. O servidor pode estar fora do ar ou bloquear o app.',true);if(onFail)onFail()};
      video.src=direct(url);video.play().catch(()=>{});
      return;
    }
    toast('Não foi possível reproduzir. O servidor pode estar fora do ar ou bloquear o app.',true);if(onFail)onFail();
  };
  const isTs=/\.ts(\?|$)/i.test(url)&&!isHls;
  if(eng==='hls'&&isTs&&window.mpegts&&mpegts.isSupported()){
    try{
      mts=mpegts.createPlayer({type:'mpegts',isLive:kind!=='vod',url:direct(url)},{enableWorker:true,liveBufferLatencyChasing:true});
      mts.on(mpegts.Events.ERROR,()=>{try{mts.destroy()}catch(e){}mts=null;fail()});
      mts.attachMediaElement(video);mts.load();
      const pr=mts.play();if(pr&&pr.catch)pr.catch(()=>{});
    }catch(e){mts=null;fail()}
    return;
  }
  if(eng==='hls'&&isHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls({capLevelToPlayerSize:true,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:20,liveSyncDurationCount:4,enableWorker:true,lowLatencyMode:false});
    let tries=0;
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries++<2)hls.startLoad();
      else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&tries++<2)hls.recoverMediaError();
      else{try{hls.destroy()}catch(e){}hls=null;fail()}
    });
    hls.loadSource(src);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
  }else{
    video.onerror=fail;
    video.src=src;video.play().catch(()=>{});
  }
}
let curPlay=null;
function nativePlay(o){
  const k=o.vod?'vod':'live';
  try{KoalaNative.play(JSON.stringify({url:o.url,title:o.title,vod:!!o.vod,engine:engineOf(k),pos:o.vod?(store.pos[o.url]||0):0}))}
  catch(e){toast('Não foi possível abrir o player.',true)}
}
function openPlayer(o){
  if(NATIVE){nativePlay(o);return}
  curPlay=o;
  detach();
  $('#pl').innerHTML=`<div class="overlay player"><div class="pbox"><div class="pbar"><button class="rb" data-act="pclose" aria-label="Fechar player" style="background:#1a1a1a;border-color:#333;color:#fff">${ic('back')}</button><b>${esc(o.title)}</b><button class="btn" data-act="swapeng" id="swapb">${engineOf(o.vod?'vod':'live')==='hls'?'Player do aparelho':'Player do app'}</button></div><video id="pvid" data-vod="${o.vod?1:0}" controls playsinline autoplay></video></div></div>`;
  const v=$('#pvid');
  if(o.vod){
    const p=store.pos[o.url];
    if(p>10)v.addEventListener('loadedmetadata',()=>{try{v.currentTime=p}catch(e){}},{once:true});
    let last=0;
    v.addEventListener('timeupdate',()=>{const t=Math.floor(v.currentTime);if(t-last>=5||t<last){last=t;store.pos[o.url]=t;save()}});
    v.addEventListener('ended',()=>{delete store.pos[o.url];save()});
  }
  attach(v,o.url,null,o.vod?'vod':'live');
}
function closePlayer(){detach();$('#pl').innerHTML=''}
function goFull(v){
  if(!v)return;
  try{(v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen).call(v)}catch(e){}
}

async function loadEpg(it){
  const box=$('#epg');if(!box)return;
  if(!S.xc||!it.id){box.innerHTML='<span>Programação disponível em contas Xtream.</span>';return}
  const key=it.id;
  if(!epgCache.has(key)){
    box.innerHTML='<span>Carregando programação…</span>';
    try{
      const r=await getJSON(`${S.xc.q}&action=get_short_epg&stream_id=${it.id}&limit=3`);
      const dec=t=>{try{return decodeURIComponent(escape(atob(t)))}catch(e){return t}};
      epgCache.set(key,(r.epg_listings||[]).map(x=>({t:dec(x.title),a:+x.start_timestamp,b:+x.stop_timestamp})));
    }catch(e){epgCache.set(key,[])}
  }
  if(V.live.sel!==it.key)return;
  const l=epgCache.get(key);
  $('#epg').innerHTML=l.length?l.map((x,i)=>`<div class="${i?'':'cur'}"><b>${fmtTime(x.a)}</b>${esc(x.t)}</div>`).join(''):'<span>Sem programação disponível para este canal.</span>';

  net:modNet,

  setneng:t=>{store.nengine=store.nengine||{};store.nengine[t.dataset.k]=t.dataset.v;save();modPlayer()},

  clear:()=>{store.pos={};epgCache.clear();save();toast('Cache limpo.')},
  refresh:()=>{if(S.profile.type==='m3u'&&S.profile.text!=null)return toast('Listas de arquivo não podem ser atualizadas. Escolha o arquivo de novo.',true);enter(S.profile)},
  logout:()=>{S=null;store.active=null;save();detach();location.hash='entrar';route()},
  'par-unlock':()=>{if($('#f-pin').value===store.pin){unlocked=true;closeModal();toast('Categorias liberadas nesta sessão.');route()}else toast('PIN incorreto.',true)},
  'par-off':()=>{if($('#f-pin').value===store.pin){store.parental=false;store.pin='';save();closeModal();toast('Controle parental desativado.');route()}else toast('PIN incorreto.',true)},
  pclose:closePlayer,
  swapeng:()=>{
    const v=$('#pvid');if(!v||!curPlay)return;
    const k=curPlay.vod?'vod':'live',next=engineOf(k)==='hls'?'native':'hls';
    const t=v.currentTime||0;
    store.engine=store.engine||{live:'hls',vod:'hls'};store.engine[k]=next;store.engineTouched=true;save();

    if(curPlay.vod&&t>2)v.addEventListener('loadedmetadata',()=>{try{v.currentTime=t}catch(e){}},{once:true});
    toast(next==='hls'?'Usando o player do app.':'Usando o player do aparelho.');
  },
  close:closeModal
};

/* ---------- controle remoto e teclado ---------- */
const BACK_CODES=[4,10009,461,27];
function goBack(){
  if($('#pl').firstChild){closePlayer();return}
  if($('#layer').firstChild){closeModal();return}
  if(S&&location.hash&&location.hash!=='#inicio')location.hash='inicio';
}
function focusables(){
  const root=$('#layer').firstChild?$('#layer'):$('#view');
  return $$('button,input,select,[tabindex="0"]',root).filter(el=>{
    if(el.disabled||el.type==='hidden')return false;
    const r=el.getBoundingClientRect();return r.width>0&&r.height>0;
  });
}
function moveFocus(dir){
  const list=focusables();if(!list.length)return;
  const cur=document.activeElement;
  if(!cur||cur===document.body||!(cur.getBoundingClientRect&&cur.closest('#view,#layer'))){list[0].focus();return}
  const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;
  let best=null,bs=Infinity;
  for(const el of list){
    if(el===cur)continue;
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let p,perp,off;
    if(dir==='ArrowRight'){if(cx<=ax+2)continue;p=Math.max(0,r.left-a.right);perp=Math.max(0,r.top-a.bottom,a.top-r.bottom);off=Math.abs(cy-ay)}
    else if(dir==='ArrowLeft'){if(cx>=ax-2)continue;p=Math.max(0,a.left-r.right);perp=Math.max(0,r.top-a.bottom,a.top-r.bottom);off=Math.abs(cy-ay)}
    else if(dir==='ArrowDown'){if(cy<=ay+2)continue;p=Math.max(0,r.top-a.bottom);perp=Math.max(0,r.left-a.right,a.left-r.right);off=Math.abs(cx-ax)}
    else{if(cy>=ay-2)continue;p=Math.max(0,a.top-r.bottom);perp=Math.max(0,r.left-a.right,a.left-r.right);off=Math.abs(cx-ax)}
    const s=p+perp*4+off*0.35;
    if(s<bs){bs=s;best=el}
  }
  if(best){best.focus({preventScroll:true});try{best.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}}
}
function zap(d){
  const a=filtered('live');if(!a.length)return;
  let i=a.findIndex(x=>x.key===V.live.sel);
  i=Math.max(0,Math.min(a.length-1,i<0?0:i+d));
  if(a[i].key===V.live.sel)return;
  selectLive(a[i].key);
  const row=$('.row.on .rmain');if(row)try{row.scrollIntoView({block:'nearest'})}catch(e){}
}
document.addEventListener('keydown',e=>{
  const t=document.activeElement,typing=!!(t&&t.matches&&t.matches('input,textarea'));
  let k=e.key;
  const KC={37:'ArrowLeft',38:'ArrowUp',39:'ArrowRight',40:'ArrowDown'},KN={Left:'ArrowLeft',Right:'ArrowRight',Up:'ArrowUp',Down:'ArrowDown'};
  if(KC[e.keyCode])k=KC[e.keyCode];else if(KN[k])k=KN[k];
  if(k==='Escape'||k==='GoBack'||k==='BrowserBack'||k==='XF86Back'||BACK_CODES.includes(e.keyCode)||(k==='Backspace'&&!typing)){
    e.preventDefault();goBack();return;
  }
  const pv=$('#pl').firstChild?$('#pvid'):null;
  if(pv){
    if(k==='ArrowLeft'||k==='ArrowRight'){if(pv.dataset.vod==='1'){e.preventDefault();pv.currentTime=Math.max(0,pv.currentTime+(k==='ArrowRight'?10:-10))}return}
    if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();pv.volume=Math.max(0,Math.min(1,pv.volume+(k==='ArrowUp'?.1:-.1)));return}
    if(k==='MediaPlayPause'||e.keyCode===179||((k==='Enter'||k===' ')&&!(t&&t.matches('button')))){e.preventDefault();pv.paused?pv.play().catch(()=>{}):pv.pause()}
    return;
  }
  if(k==='MediaPlayPause'||e.keyCode===179){
    const v=$('#pv');if(v){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause()}return;
  }
  if(!typing&&location.hash==='#ao-vivo'&&!$('#layer').firstChild){
    if(k==='ChannelUp'||k==='PageUp'||k==='MediaTrackPrevious'||e.keyCode===427){e.preventDefault();zap(-1);return}
    if(k==='ChannelDown'||k==='PageDown'||k==='MediaTrackNext'||e.keyCode===428){e.preventDefault();zap(1);return}
  }
  if(k==='ArrowDown'||k==='ArrowUp'||k==='ArrowLeft'||k==='ArrowRight'){
    if(typing&&(k==='ArrowLeft'||k==='ArrowRight'))return;
    e.preventDefault();moveFocus(k);
  }
});
let efT=null;
new MutationObserver(()=>{
  if(store.mode!=='tv')return;
  clearTimeout(efT);
  efT=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a!==document.body&&a.isConnected)return;
    const f=$('#layer .btn.primary')||$('#layer button')||$('#view [data-nav] button')||focusables()[0];
    if(f)f.focus({preventScroll:true});
  },60);
}).observe(document.getElementById('stage'),{childList:true,subtree:true});
function tvFull(){
  if(store.mode!=='tv'||document.fullscreenElement)return;
  try{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}
}
document.addEventListener('keydown',tvFull,{once:true,capture:true});
document.addEventListener('click',tvFull,{once:true,capture:true});
document.addEventListener('click',async()=>{
  const m=matchMedia('(orientation:portrait)');
  if(store.mode!=='mobile'||!m.matches||!screen.orientation||!screen.orientation.lock||document.fullscreenElement)return;
  try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}
},{once:true});
window.addEventListener('online',()=>{if(location.hash==='#inicio')route()});
window.addEventListener('offline',()=>{if(location.hash==='#inicio')route()});

/* ---------- rotas ---------- */
function route(){
  const h=(location.hash||'').slice(1)||'inicio';
  closeModal();
  if(h==='modo'){renderMode();return}
  if(!S){if(h!=='entrar'){location.hash='entrar';return}renderLogin();return}
  if(h!=='ao-vivo'&&h!=='entrar')detach();
  const R={inicio:renderHome,'ao-vivo':renderLive,filmes:()=>renderGrid('vod'),series:()=>renderGrid('series'),recentes:renderRecent,config:renderConfig,entrar:renderLogin};
  (R[h]||renderHome)();
  window.scrollTo(0,0);$('#view').scrollTop=0;
  if(store.mode==='tv'){const f=$('#view [data-nav] button,#view button,#view input');if(f)f.focus({preventScroll:true})}
}
window.addEventListener('hashchange',route);
(async function boot(){
  applyMode();
  if(!store.mode){location.hash='modo';route();return}
  await proceed();
})();
})();
